[package]
name = "concentrated-liquidity"
version = "0.1.0"
edition = "2021"
description = "Concentrated Liquidity AMM with Tick Math & Range Orders (Uniswap v3 style)"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.0.6"
common-math = { path = "../../crates/common-math" }

[dev-dependencies]
soroban-sdk = { version = "21.0.6", features = ["testutils"] }
proptest = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true